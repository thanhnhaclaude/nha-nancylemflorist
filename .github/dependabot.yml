# Dependabot keeps npm packages and GitHub Actions up to date.
# Security fixes are opened as soon as an advisory is published (when
# "Dependabot security updates" is enabled in the repo settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: America/Denver
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: deps
    groups:
      # One PR for all non-breaking updates instead of one per package
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the Node.js major we run on Hostinger (20+)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is not supported by Next.js yet
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: ci
