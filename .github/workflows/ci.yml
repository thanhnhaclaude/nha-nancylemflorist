name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily security audit, so new advisories show up even without code changes
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://nancylemflorist.com
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=moderate
